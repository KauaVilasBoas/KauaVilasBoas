name: Profile cards

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    name: Stats, languages and streak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=KauaVilasBoas&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&bg_color=0D1117&title_color=A78BFA&icon_color=512BD4&text_color=c9d1d9&ring_color=A78BFA
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=KauaVilasBoas&layout=compact&hide_border=true&langs_count=8&hide=html,css,tex&bg_color=0D1117&title_color=A78BFA&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=KauaVilasBoas&hide_border=true&background=0D1117&stroke=30363d&ring=512BD4&fire=A78BFA&currStreakNum=c9d1d9&currStreakLabel=A78BFA&sideNums=c9d1d9&sideLabels=8b949e&dates=8b949e
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "chore(profile): refresh dashboard cards"
          git push

  isocalendar:
    name: Contribution calendar
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: KauaVilasBoas
          filename: profile/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Bahia
